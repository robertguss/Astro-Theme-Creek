name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the version pinned in package.json's packageManager field, and
      # must run before setup-node so that cache: pnpm can find the store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # The RSS feed and sitemap are generated by integrations that can silently
      # stop emitting files when a dependency changes, so assert they exist
      # rather than trusting the build's exit code alone.
      - name: Check generated files
        run: |
          for f in dist/index.html dist/rss.xml dist/sitemap-index.xml public/search-index.json; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
          done
          grep -q "<item>" dist/rss.xml || { echo "rss.xml has no items"; exit 1; }
