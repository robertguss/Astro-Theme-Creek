version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # One PR per ecosystem-wide batch instead of one per package. The previous
    # ungrouped config produced a backlog of nine PRs that each went stale as
    # soon as the next one landed.
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
      dev-tooling:
        patterns:
          - "tailwindcss"
          - "autoprefixer"
          - "postcss"
          - "sass"
        update-types:
          - "minor"
          - "patch"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keeps the build workflow's actions current; previously unmanaged.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
